server:
  port: 8080

spring:
  profiles:
    # dev   = 通用开发配置（进版本库）
    # local = 本机私密密钥（不进版本库，见根目录 .gitignore）
    # 后加载的 local 会覆盖 dev 里的同名配置
    active: dev,local
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${shike.datasource.driver-class-name}
      url: jdbc:mysql://${shike.datasource.host}:${shike.datasource.port}/${shike.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${shike.datasource.username}
      password: ${shike.datasource.password}
  redis:
    host: ${shike.redis.host}
    port: ${shike.redis.port}
    password: ${shike.redis.password}
    database: ${shike.redis.database} #默认数据库是0，可不配置

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shike.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      shike:
        mapper: debug
        service: info
        controller: info

shike:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: itheima
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${shike.alioss.endpoint}
    access-key-id: ${shike.alioss.access-key-id}
    access-key-secret: ${shike.alioss.access-key-secret}
    bucket-name: ${shike.alioss.bucket-name}
    # 设置上传文件大小限制
    max-size: 10485760
  wechat:
    appid: ${shike.wx.app-id}
    secret: ${shike.wx.app-secret}
    mchid: ${shike.wx.mch-id}
    mchSerialNo: ${shike.wx.mcg-serial-no}
    privateKeyFilePath: ${shike.wx.private-key-path}
    apiV3Key: ${shike.wx.api-v3-key}
    weChatPayCertFilePath: ${shike.wx.wechat-pay-cert-path}
    notifyUrl: ${shike.wx.notify-url}
    refundNotifyUrl: ${shike.wx.refund-notify-url}
  shop:
    address: ${shike.shop.address}
  baidu:
    ak: ${shike.baidu.ak}

